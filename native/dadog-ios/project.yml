name: Dadog
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
targets:
  Dadog:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devonakins.dadog.local
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dadog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DadogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Dadog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dadog:
    build:
      targets:
        Dadog: all
        DadogTests: [test]
    test:
      targets: [DadogTests]

