name: DS011 Studio local host source review
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'docs/DS011-STUDIO-*'
      - '.github/workflows/studio-source-review.yml'
permissions:
  contents: read
concurrency:
  group: ds011-studio-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contract-and-local-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Inspect isolated Studio sources
        run: |
          node --check studio/src/projects.mjs
          node --check studio/src/local-host.mjs
          node --check studio/src/cli.mjs
          node --test studio/test/*.test.mjs
