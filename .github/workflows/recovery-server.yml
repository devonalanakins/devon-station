name: Recovered server verification
on:
  # A PR already verifies feature branch changes; avoid a second push run.
  push:
    branches:
      - main
      - feature/ds011-rb01-integrated-review
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Preserve existing runs: cancellation requires explicit owner approval.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix workerd-test --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix workerd-test
      - name: Replay on October 30 pinned workerd at October 28 compatibility date
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ds011-oct-workerd"
          npm install --prefix "$RUNNER_TEMP/ds011-oct-workerd" --ignore-scripts --no-audit --no-fund --no-save --package-lock=false workerd@1.20261030.1
          test -x "$RUNNER_TEMP/ds011-oct-workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd"
          MINIFLARE_WORKERD_PATH="$RUNNER_TEMP/ds011-oct-workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd" DS_WORKERD_COMPAT_DATE=2026-10-28 npm test --prefix workerd-test
  unified-application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert tested source is the exact triggering head
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements-browser.txt
      - run: npm run build
      - run: npm run verify:privacy
      - run: npm run test:runtime:dom
      - run: node tools/runtime-ai-work-browser.cjs
        env:
          DS_CHROME: /usr/bin/google-chrome
      - run: node tools/runtime-assistant-browser.cjs
        env:
          DS_CHROME: /usr/bin/google-chrome
      - run: npm run test:runtime:browser
        env:
          DS_CHROME: /usr/bin/google-chrome
      - run: npm run test:browser
        env:
          DS_CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-work-browser-evidence
          path: |
            tools/ai-work-*.png
            tools/ai-work-browser-results.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-browser-evidence
          path: |
            tools/assistant-*.png
            tools/assistant-browser-results.json
            tools/home-*.png
            tools/today-*.png
            tools/browser-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify protected release boundary or prepare legacy review-only candidate
        id: release_boundary
        shell: bash
        run: |
          if test -f worker/assistant-evidence.mjs; then
            node tools/verify-assistant-release-boundary.mjs
            echo "review_bundle=false" >> "$GITHUB_OUTPUT"
          else
            node tools/prepare-rb01-review.mjs
            node tools/verify-ai-work-release-boundary.mjs
            (cd release-review && sha256sum -c SHA256SUMS)
            cp release-review/SHA256SUMS "$RUNNER_TEMP/rb01-first-sums"
            node tools/prepare-rb01-review.mjs
            cmp "$RUNNER_TEMP/rb01-first-sums" release-review/SHA256SUMS
            echo "review_bundle=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and independently verify Generation 2 source-only review artifacts
        if: steps.release_boundary.outputs.review_bundle == 'false'
        shell: bash
        run: |
          node tools/prepare-gen2-review.mjs
          (cd release-review/gen2 && sha256sum -c SHA256SUMS)
          cp release-review/gen2/SHA256SUMS "$RUNNER_TEMP/ds011-gen2-first-sums"
          node tools/prepare-gen2-review.mjs
          cmp "$RUNNER_TEMP/ds011-gen2-first-sums" release-review/gen2/SHA256SUMS
          node tools/verify-assistant-release-boundary.mjs
      - name: Observe real GitHub PR stack with read-only Generation 2 preflight
        if: steps.release_boundary.outputs.review_bundle == 'false' && github.event_name == 'pull_request' && github.event.pull_request.number == 55
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEN2_EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tools/gen2-release-preflight.mjs --report > release-review/gen2/preflight-report.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("release-review/gen2/preflight-report.json","utf8"));
            if(r.releaseDecision!=="RELEASE_NO_GO"||r.canDeploy!==false||
               r.uploadAuthorized!==false||r.readOnly!==true||
               r.sourceCommit!==process.env.GEN2_EXPECTED_SOURCE_HEAD||
               r.dependencyCount!==12||!Array.isArray(r.blockers)||
               !r.blockers.includes("owner_approval_not_present")||
               !r.blockers.includes("protected_uploader_not_established"))
              throw Error("Gen2 source-only readiness report contract changed");
            console.log("Generation 2 live GitHub source inspection: RELEASE_NO_GO, "+r.dependencyCount+" dependencies observed; "+r.blockers.length+" blockers recorded");
          '
      - uses: actions/upload-artifact@v4
        if: steps.release_boundary.outputs.review_bundle == 'false'
        with:
          name: ds011-gen2-source-only-review
          path: release-review/gen2/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.release_boundary.outputs.review_bundle == 'true'
        with:
          name: ds011-rb01-review-only-bundles
          path: release-review/
          if-no-files-found: error
          retention-days: 7
